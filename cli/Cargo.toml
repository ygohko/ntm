[package]
name = "ntm-cli"
version = "0.9.0"
edition = "2021"

[dependencies]
camino = "1.1.10"
clap = { version = "4.5.31", features = ["derive"] }
ntm-model = { path = "../model" }
regex = "1.11.1"
serde_json = "1.0.116"

[dev-dependencies]
tempdir = "0.3.7"

[[bin]]
name = "ntm"
path = "src/main.rs"
